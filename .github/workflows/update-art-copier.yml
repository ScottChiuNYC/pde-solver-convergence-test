name: Update ART with Copier

on:
  push:
    branches:
      - art/copier-bootstrap-20261022
    paths:
      - .github/workflows/update-art-copier.yml

permissions:
  contents: write

jobs:
  update-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/copier-bootstrap-20261022
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Copier
        run: python -m pip install 'copier==9.19.1'

      - name: Update ART to pinned revision
        env:
          ART_REF: 37a0d1de4cd18059775ee31b69dd878f6d8d5456
        shell: bash
        run: |
          set -euo pipefail
          copier update -a .copier-answers.art.yml --vcs-ref "$ART_REF" --defaults
          grep -q '^_commit: 37a0d1d$' .copier-answers.art.yml

      - name: Commit generated ART update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/publish-codebinder-pdf.yml'
          git diff --cached --check
          git commit -m "Update ART Copier template"
          git push origin HEAD:art/copier-bootstrap-20261022
