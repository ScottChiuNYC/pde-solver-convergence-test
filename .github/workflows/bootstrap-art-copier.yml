name: Bootstrap ART with Copier

on:
  push:
    branches:
      - art/copier-bootstrap-20261022
    paths:
      - .github/workflows/bootstrap-art-copier.yml

permissions:
  contents: write

jobs:
  apply-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/copier-bootstrap-20261022
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Copier
        run: python -m pip install 'copier==9.19.1'

      - name: Apply pinned ART template
        env:
          ART_REF: b63381c240525bc218fb565927ab0ac1921294aa
        shell: bash
        run: |
          set -euo pipefail
          copier copy --defaults --vcs-ref "$ART_REF" https://github.com/ScottChiuNYC/agentic-repo-template.git .
          test -f .copier-answers.art.yml
          test -f AGENTS.md
          test -f .codebinderignore
          test -f .github/workflows/publish-codebinder-pdf.yml
          test -f .agents/skills/codebinder-pdf/SKILL.md

      - name: Commit generated non-workflow ART overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/publish-codebinder-pdf.yml'
          git diff --cached --check
          git commit -m "Apply ART Copier template"
          git push origin HEAD:art/copier-bootstrap-20261022
