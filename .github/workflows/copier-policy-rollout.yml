name: One-time pinned Copier coding-policy rollout
on:
  push:
    branches: ['policy/coding-standards-20261030']
    paths: ['.github/workflows/copier-policy-rollout.yml']
permissions:
  contents: write
jobs:
  copier-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Copier
        run: python -m pip install copier==9.19.1
      - name: Apply pinned Copier updates
        env:
          PYPACKAGE_REF: 8d6b1c2ff846e0da3ce9fa376644f94007cf5acd
          ART_REF: 41deddf7cddd1fa6940c9457ee38c16cc6792c99
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          copier update --defaults --conflict rej -a .copier-answers.pypackage-cpp.yml --vcs-ref "$PYPACKAGE_REF"
          if find . -name '*.rej' -not -path './.git/*' | grep -q .; then
            echo 'Unresolved Python/C++ Copier reject'; exit 1
          fi
          git add -A
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          allowed = {'.copier-answers.pypackage-cpp.yml', 'docs/development/PROJECT_SKELETON_CONTRACT.md'}
          if changed != allowed:
              raise SystemExit(f'Unexpected Python/C++ Copier changes: {sorted(changed)}')
          if '## 13. Coding standards' not in Path('docs/development/PROJECT_SKELETON_CONTRACT.md').read_text():
              raise SystemExit('Coding standards missing from generated contract')
          PY
          git diff --cached --check
          git commit -m 'Update Python/C++ skeleton via pinned Copier'
          copier update --defaults --conflict rej -a .copier-answers.art.yml --vcs-ref "$ART_REF"
          if find . -name '*.rej' -not -path './.git/*' | grep -q .; then
            echo 'Unresolved ART Copier reject'; exit 1
          fi
          git add -A
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          allowed = {'.copier-answers.art.yml', 'AGENTS.md'}
          if changed != allowed:
              raise SystemExit(f'Unexpected ART Copier changes: {sorted(changed)}')
          if '## Project coding conventions' not in Path('AGENTS.md').read_text():
              raise SystemExit('Agent coding policy missing')
          PY
          git diff --cached --check
          git commit -m 'Update ART agent guide via pinned Copier'
          git push origin HEAD:policy/coding-standards-20261030
