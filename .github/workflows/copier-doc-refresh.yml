name: One-time Copier Documentation Refresh

on:
  push:
    branches:
      - docs/copier-refresh-cold-start
    paths:
      - .github/workflows/copier-doc-refresh.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: docs/copier-refresh-cold-start
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Copier
        run: python -m pip install 'copier==9.19.1'

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Genuine Python/C++ Copier update
        shell: bash
        run: |
          set -euo pipefail
          copier update --defaults --conflict rej \
            --answers-file .copier-answers.pypackage-cpp.yml \
            --vcs-ref cc2e45016c5a49a46f9e58b357a80e0402274db0
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo '::error::Python/C++ Copier update produced rejection files'
            find . -name '*.rej' -print
            exit 1
          fi
          grep -q 'Independent overlays and review publication' docs/development/PROJECT_SKELETON_CONTRACT.md
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .copier-answers.pypackage-cpp.yml|docs/development/PROJECT_SKELETON_CONTRACT.md)
                ;;
              *)
                echo "::error::Unexpected Python/C++ Copier change: $path"
                exit 1
                ;;
            esac
          done
          git add .copier-answers.pypackage-cpp.yml docs/development/PROJECT_SKELETON_CONTRACT.md
          git diff --cached --check
          git commit -m 'Genuine Copier update Python/C++ documentation'

      - name: Genuine ART Copier update
        shell: bash
        run: |
          set -euo pipefail
          copier update --defaults --conflict rej \
            --answers-file .copier-answers.art.yml \
            --vcs-ref 24af6c64e5e209a1966229e32dcbd8388ad32402
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo '::error::ART Copier update produced rejection files'
            find . -name '*.rej' -print
            exit 1
          fi
          grep -q 'Repository provenance and ownership' AGENTS.md
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .copier-answers.art.yml|AGENTS.md)
                ;;
              *)
                echo "::error::Unexpected ART Copier change: $path"
                exit 1
                ;;
            esac
          done
          git add .copier-answers.art.yml AGENTS.md
          git diff --cached --check
          git commit -m 'Genuine Copier update ART documentation'

      - name: Push generated documentation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git push origin HEAD:docs/copier-refresh-cold-start
